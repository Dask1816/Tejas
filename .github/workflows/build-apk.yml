name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create Temporary Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Clean up Temporary Debug Keystore
        if: always()
        run: rm -f debug.keystore

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}.${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Debug Release v${{ github.run_number }}.${{ github.run_attempt }}
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: "true"
          draft: false
          prerelease: false

      - name: Report Workflow Summary
        if: always()
        run: |
          echo "## Workflow Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Confirmed AGP Version:** 9.1.1" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version Requirement:** JDK 17" >> $GITHUB_STEP_SUMMARY
          echo "- **Exact Gradle Version:** 9.3.1" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Command:** \`gradle :app:assembleDebug --stacktrace --no-daemon\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Path:** \`app/build/outputs/apk/debug/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Actions Artifact Name:** \`app-debug-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`v${{ github.run_number }}.${{ github.run_attempt }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Asset Filename:** \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "### 🚀 Release Publishing: SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "The latest release contains the directly downloadable \`app-debug.apk\` file." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Release Publishing: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "Release publishing failed or was skipped, but the Actions artifact \`app-debug-apk\` remains fully preserved and available." >> $GITHUB_STEP_SUMMARY
          fi
